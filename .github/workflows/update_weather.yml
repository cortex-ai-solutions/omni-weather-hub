name: Update Weather Snapshot

on:
  schedule:
    - cron: '0 6 * * *'   # täglich 06:00 UTC = 07:00 / 08:00 MEZ/MESZ
  workflow_dispatch:       # manueller Trigger über GitHub UI

permissions:
  contents: write          # für git push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache SQLite DB
        uses: actions/cache@v4
        with:
          path: weather.db
          key: weather-db-${{ github.run_id }}
          restore-keys: weather-db-

      - name: Install dependencies
        run: pip install -r requirements-actions.txt

      - name: Fetch latest weather data
        run: python scripts/fetch_openmeteo.py --update

      - name: Generate snapshot JSON
        run: python scripts/generate_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_snapshot.json
          git diff --cached --quiet || git commit -m "chore: update weather snapshot [skip ci]"
          git push
